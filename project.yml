name: WeldingGasWallet
options:
  bundleIdPrefix: com.goodusestudios
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
targets:
  WeldingGasWallet:
    type: application
    platform: iOS
    sources:
      - path: Shell
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_NAME: WeldingGasWallet
        PRODUCT_BUNDLE_IDENTIFIER: com.goodusestudios.weldinggaswallet
        INFOPLIST_FILE: Shell/Resources/Info.plist
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
  WeldingGasWalletTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ShellTests
    dependencies:
      - target: WeldingGasWallet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  WeldingGasWalletUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ShellUITests
    dependencies:
      - target: WeldingGasWallet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WeldingGasWallet:
    build:
      targets:
        WeldingGasWallet: all
        WeldingGasWalletTests: [test]
        WeldingGasWalletUITests: [test]
    test:
      targets:
        - WeldingGasWalletTests
        - WeldingGasWalletUITests
