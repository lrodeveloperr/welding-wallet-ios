name: iOS · Upload reviewed build to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Unique positive App Store Connect build number
        required: true
        default: "20260821"
      confirmation:
        description: Type UPLOAD TESTFLIGHT to upload from main
        required: true
        default: BUILD ONLY

permissions:
  contents: read

concurrency:
  group: welding-wallet-testflight
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.8"
  BUNDLE_ID: com.goodusestudios.weldinggaswallet
  TEAM_ID: 49SQ3XQ68Q
  BUILD_NAME: 1.0.0

jobs:
  testflight:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'UPLOAD TESTFLIGHT'
    environment: production
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Validate inputs and required App Store Connect secrets
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          EXPORT_COMPLIANCE_EVIDENCE: ${{ secrets.APPLE_EXPORT_COMPLIANCE_EVIDENCE_ID }}
          REQUESTED_BUILD: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_BUILD" =~ ^[1-9][0-9]{0,17}$ ]] || { echo "Invalid build number"; exit 1; }
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY EXPORT_COMPLIANCE_EVIDENCE; do
            test -n "${!name:-}" || { echo "Missing required secret: $name"; exit 1; }
          done
          echo "EFFECTIVE_BUILD_NUMBER=$REQUESTED_BUILD" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate and validate iOS host
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          flutter create "$RUNNER_TEMP/weldinggaswallet_host" \
            --platforms=ios --org com.goodusestudios --project-name weldinggaswallet
          cp -R "$RUNNER_TEMP/weldinggaswallet_host/ios" ./ios
          python3 tool/configure_hosts.py ios
          grep -F 'import UserNotifications' ios/Runner/AppDelegate.swift
          grep -F 'UNUserNotificationCenter.current().delegate = self' ios/Runner/AppDelegate.swift
          ! /usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' ios/Runner/Info.plist >/dev/null 2>&1
          ! rg -n 'basic_utils|pointycastle|CryptoUtils|SHA1withRSA' lib pubspec.yaml
          flutter pub get
          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze --fatal-infos
          python3 -m unittest discover -s tool -p 'test_*.py'
          flutter test --test-randomize-ordering-seed=random
          test "$(find assets/l10n -maxdepth 1 -name 'app_*.arb' | wc -l | tr -d ' ')" = "30"
          rg -n "com.gooduse.weldinggaswallet.pro.lifetime" lib

      - name: Prepare generated workspace
        run: >-
          flutter build ios --release --no-codesign
          --build-name="$BUILD_NAME" --build-number="$EFFECTIVE_BUILD_NUMBER"

      - name: Install App Store Connect API key
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Create App Store export policy
        shell: bash
        run: |
          mkdir -p ci
          cat > ci/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          plutil -lint ci/ExportOptions.plist

      - name: Archive with automatic App Store signing
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/WeldingGasWallet.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$EFFECTIVE_BUILD_NUMBER"

      - name: Verify archive identity and build
        shell: bash
        run: |
          set -euo pipefail
          APP_INFO="$(find "$RUNNER_TEMP/WeldingGasWallet.xcarchive/Products/Applications" -maxdepth 2 -name Info.plist -print -quit)"
          test -n "$APP_INFO"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_INFO")" = "$BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_INFO")" = "$EFFECTIVE_BUILD_NUMBER"
          find "$RUNNER_TEMP/WeldingGasWallet.xcarchive" -name 'PrivacyInfo.xcprivacy' -print | tee privacy-manifests.txt
          test -s privacy-manifests.txt

      - name: Export, validate and upload IPA
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/WeldingGasWallet.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ci/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          IPA="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA"
          xcrun altool --validate-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          shasum -a 256 "$IPA" | tee "$RUNNER_TEMP/export/SHA256SUMS.txt"

      - name: Retain private TestFlight evidence
        shell: bash
        run: cp pubspec.lock "$RUNNER_TEMP/export/pubspec.lock"

      - name: Upload private TestFlight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Welding-Gas-Wallet-TestFlight-${{ inputs.build_number }}
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/export/SHA256SUMS.txt
            ${{ runner.temp }}/export/pubspec.lock
            privacy-manifests.txt
          if-no-files-found: error
          retention-days: 14

      - name: Remove App Store Connect API key
        if: always()
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
