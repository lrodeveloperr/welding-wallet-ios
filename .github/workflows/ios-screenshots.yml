name: iOS screenshot capture

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode and install XcodeGen
        run: |
          if [[ -d /Applications/Xcode_26.6.app ]]; then sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer; fi
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodebuild -version
      - name: Validate and generate project
        run: |
          scripts/validate-shell.sh --app
          xcodegen generate
      - name: Select simulator
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
            preferred = ["iPhone 17 Pro Max", "iPhone 17 Pro", "iPhone 16 Pro Max", "iPhone 16 Pro"]
            phone = preferred.lazy.map { |name| devices.find { |d| d["isAvailable"] && d["name"] == name } }.find(&:itself)
            phone ||= devices.find { |d| d["isAvailable"] && d["name"].start_with?("iPhone") }
            abort "No available iPhone simulator" unless phone
            puts phone.fetch("udid")
          ')"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Capture every app screen
        id: capture
        continue-on-error: true
        run: |
          xcodebuild -project WeldingGasWallet.xcodeproj -scheme WeldingGasWallet -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -resultBundlePath ScreenshotResults.xcresult CODE_SIGNING_ALLOWED=NO -only-testing:WeldingGasWalletUITests/WeldingGasWalletUITests/testCaptureAllScreens test
      - name: Package screenshots
        if: always()
        run: |
          rm -rf screenshots
          mkdir -p screenshots
          xcrun xcresulttool export attachments --path ScreenshotResults.xcresult --output-path screenshots
          COUNT="$(find screenshots -type f -name '*.png' | wc -l | tr -d ' ')"
          echo "Captured $COUNT of 24 screenshots"
          ditto -c -k --sequesterRsrc --keepParent screenshots WeldingGasWallet-iPhone-All-Screens.zip
          test "$COUNT" = "24"
      - name: Upload numbered screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: WeldingGasWallet-iPhone-All-Screens
          path: |
            WeldingGasWallet-iPhone-All-Screens.zip
            ScreenshotResults.xcresult
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce capture success
        if: steps.capture.outcome != 'success'
        run: exit 1
